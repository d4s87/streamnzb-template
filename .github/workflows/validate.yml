name: Validate StreamNZB Template

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate profile and Define library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache-dependency-path: tests/streamnzb_compat/go.sum

      - name: Validate profile and Define library
        run: python tests/test_profile_defines.py

      - name: Test generated profile variants
        run: python tests/test_profile_variants.py

      - name: Run Vidhin sync tests
        run: python tests/test_vidhin_sync.py

      - name: Test Vidhin sync workflow PR governance
        run: ./tests/test_vidhin_workflow_pr_metadata.sh

      - name: Test shared Discord payload helpers
        run: python tests/test_discord_common.py

      - name: Test Vidhin Discord notifications
        run: python tests/test_vidhin_discord.py

      - name: Test release Discord notifications
        run: python tests/test_release_discord.py

      - name: Test shared Discord webhook sender
        run: ./tests/test_send_discord_webhook.sh

      - name: Test PR metadata branch/title validation
        run: ./tests/test_validate_pr_metadata.sh

      - name: Validate Anime tier integrity
        run: python tests/test_tier_integrity.py

      - name: Test against StreamNZB engine
        run: ./scripts/test_streamnzb_compat.sh
