name: Validate StreamNZB Template

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profile and Define library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate profile and Define library
        run: python tests/test_profile_defines.py

      - name: Run Vidhin sync tests
        run: python tests/test_vidhin_sync.py
