name: Validate StreamNZB Template

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profile and Define library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
          cache-dependency-path: tests/streamnzb_compat/go.sum

      - name: Validate profile and Define library
        run: python tests/test_profile_defines.py

      - name: Test generated profile variants
        run: python tests/test_profile_variants.py

      - name: Run Vidhin sync tests
        run: python tests/test_vidhin_sync.py

      - name: Test Vidhin Discord notifications
        run: python tests/test_vidhin_discord.py

      - name: Test release Discord notifications
        run: python tests/test_release_discord.py

      - name: Validate Anime tier integrity
        run: python tests/test_tier_integrity.py

      - name: Test against StreamNZB engine
        run: ./scripts/test_streamnzb_compat.sh